  <g transform="translate(90 1123)">
    <rect x="0" y="0" width="1420" height="126" rx="20" fill="#FFFFFF"/>
    <text x="0" y="70" class="rank">07</text>
    <text x="105" y="50" class="name">Aubergine Black + Rose Taupe</text>
    <text x="105" y="82" class="desc">희소성 있고 세련됨, 다만 의료 운영 인프라보다는 브랜드성이 강함</text>
    <rect x="560" y="28" width="176" height="56" rx="12" fill="#221A21"/><text x="560" y="111" class="hex">#221A21</text>
    <rect x="800" y="28" width="176" height="56" rx="12" fill="#B28A8B"/><text x="800" y="111" class="hex">#B28A8B</text>
    <rect x="1040" y="28" width="176" height="56" rx="12" fill="#FAF5F4" stroke="#E0D4D3"/><text x="1040" y="111" class="hex">#FAF5F4</text>
    <rect x="1280" y="28" width="176" height="56" rx="12" fill="#7B7178"/><text x="1280" y="111" class="hex">#7B7178</text>
  </g>

  <g transform="translate(90 1269)">
    <rect x="0" y="0" width="1420" height="126" rx="20" fill="#FFFFFF"/>
    <text x="0" y="70" class="rank">08</text>
    <text x="105" y="50" class="name">Charcoal + Sand</text>
    <text x="105" y="82" class="desc">부드럽고 접근성 좋음, 하지만 임팩트는 약한 편</text>
    <rect x="560" y="28" width="176" height="56" rx="12" fill="#191A1C"/><text x="560" y="111" class="hex">#191A1C</text>
    <rect x="800" y="28" width="176" height="56" rx="12" fill="#C7B28A"/><text x="800" y="111" class="hex">#C7B28A</text>
    <rect x="1040" y="28" width="176" height="56" rx="12" fill="#FBF8F0" stroke="#DDD7CB"/><text x="1040" y="111" class="hex">#FBF8F0</text>
    <rect x="1280" y="28" width="176" height="56" rx="12" fill="#8A8476"/><text x="1280" y="111" class="hex">#8A8476</text>
  </g>

  <g transform="translate(90 1415)">
    <rect x="0" y="0" width="1420" height="126" rx="20" fill="#FFFFFF"/>
    <text x="0" y="70" class="rank">09</text>
    <text x="105" y="50" class="name">Blue Graphite + Steel Cyan</text>
    <text x="105" y="82" class="desc">기술감은 좋지만 틸 계열이라 다시 의료기기 느낌이 날 수 있음</text>
    <rect x="560" y="28" width="176" height="56" rx="12" fill="#151D26"/><text x="560" y="111" class="hex">#151D26</text>
    <rect x="800" y="28" width="176" height="56" rx="12" fill="#6F9EAD"/><text x="800" y="111" class="hex">#6F9EAD</text>
    <rect x="1040" y="28" width="176" height="56" rx="12" fill="#F7FAFA" stroke="#D8E2E4"/><text x="1040" y="111" class="hex">#F7FAFA</text>
    <rect x="1280" y="28" width="176" height="56" rx="12" fill="#78848B"/><text x="1280" y="111" class="hex">#78848B</text>
  </g>

  <g transform="translate(90 1561)">
    <rect x="0" y="0" width="1420" height="126" rx="20" fill="#FFFFFF"/>
    <text x="0" y="70" class="rank">10</text>
    <text x="105" y="50" class="name">Charcoal + CrownOps Orange Link</text>
    <text x="105" y="82" class="desc">제품과 연결성은 좋지만 회사/제품 분리가 약해짐</text>
    <rect x="560" y="28" width="176" height="56" rx="12" fill="#17191D"/><text x="560" y="111" class="hex">#17191D</text>
    <rect x="800" y="28" width="176" height="56" rx="12" fill="#E86F2E"/><text x="800" y="111" class="hex">#E86F2E</text>
    <rect x="1040" y="28" width="176" height="56" rx="12" fill="#FAF8F4" stroke="#DDD7CB"/><text x="1040" y="111" class="hex">#FAF8F4</text>
    <rect x="1280" y="28" width="176" height="56" rx="12" fill="#848891"/><text x="1280" y="111" class="hex">#848891</text>
  </g>

  <line x1="90" y1="1745" x2="1510" y2="1745" stroke="#DDD7CB" stroke-width="2"/>
  <text x="90" y="1802" class="note">Recommendation: use 01 for Paraegis. Keep CrownOps orange as a separate product accent, not the parent-company color.</text>
</svg>
