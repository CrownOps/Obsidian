<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900">
  <rect width="1600" height="1900" fill="#FAF7F0"/>
  <style>
    .title { font-family: Inter, Arial, sans-serif; font-size: 64px; font-weight: 760; fill: #181A1F; }
    .subtitle { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 450; fill: #6F737A; }
    .rank { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 760; fill: #181A1F; }
    .name { font-family: Inter, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #181A1F; }
    .desc { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 450; fill: #6F737A; }
    .hex { font-family: "SF Mono", Consolas, monospace; font-size: 17px; font-weight: 600; fill: #20242A; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 1.2px; fill: #8B8F98; }
    .tag { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 750; fill: #FAF7F0; }
    .note { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #6F737A; }
  </style>

  <text x="90" y="105" class="title">Paraegis Color Direction</text>
  <text x="90" y="150" class="subtitle">Ranked parent-company palettes. CrownOps keeps orange as the product accent.</text>

  <g transform="translate(90 205)">
    <text x="0" y="0" class="label">RANK</text>
    <text x="105" y="0" class="label">PALETTE</text>
    <text x="560" y="0" class="label">MAIN</text>
    <text x="800" y="0" class="label">ACCENT</text>
    <text x="1040" y="0" class="label">BACKGROUND</text>
    <text x="1280" y="0" class="label">SUPPORT</text>
  </g>

  <g transform="translate(90 235)">
    <rect x="0" y="0" width="1420" height="138" rx="22" fill="#FFFFFF" stroke="#B89B5E" stroke-width="3"/>
    <rect x="1185" y="22" width="150" height="32" rx="16" fill="#181A1F"/>
    <text x="1210" y="44" class="tag">BEST PICK</text>
    <text x="0" y="72" class="rank">01</text>
    <text x="105" y="54" class="name">Graphite + Champagne</text>
    <text x="105" y="88" class="desc">가장 고급스럽고 Paraegis 이름값이 제일 잘 살아남</text>
    <rect x="560" y="30" width="176" height="58" rx="12" fill="#181A1F"/>
    <text x="560" y="116" class="hex">#181A1F</text>
    <rect x="800" y="30" width="176" height="58" rx="12" fill="#B89B5E"/>
    <text x="800" y="116" class="hex">#B89B5E</text>
    <rect x="1040" y="30" width="176" height="58" rx="12" fill="#FAF7F0" stroke="#DDD7CB"/>
    <text x="1040" y="116" class="hex">#FAF7F0</text>
    <rect x="1280" y="30" width="176" height="58" rx="12" fill="#8B8F98"/>
    <text x="1280" y="116" class="hex">#8B8F98</text>
  </g>

  <g transform="translate(90 393)">
    <rect x="0" y="0" width="1420" height="126" rx="20" fill="#FFFFFF"/>
    <text x="0" y="70" class="rank">02</text>
    <text x="105" y="50" class="name">Obsidian + Warm Silver</text>
    <text x="105" y="82" class="desc">차갑지 않은 엔터프라이즈 SaaS, 안정적이고 오래 감</text>
    <rect x="560" y="28" width="176" height="56" rx="12" fill="#15171C"/><text x="560" y="111" class="hex">#15171C</text>
    <rect x="800" y="28" width="176" height="56" rx="12" fill="#C8C2B4"/><text x="800" y="111" class="hex">#C8C2B4</text>
    <rect x="1040" y="28" width="176" height="56" rx="12" fill="#F8F6F0" stroke="#DDD7CB"/><text x="1040" y="111" class="hex">#F8F6F0</text>
    <rect x="1280" y="28" width="176" height="56" rx="12" fill="#737984"/><text x="1280" y="111" class="hex">#737984</text>
  </g>

  <g transform="translate(90 539)">
    <rect x="0" y="0" width="1420" height="126" rx="20" fill="#FFFFFF"/>
    <text x="0" y="70" class="rank">03</text>
    <text x="105" y="50" class="name">Ink Navy + Platinum</text>
    <text x="105" y="82" class="desc">신뢰감이 강하고 B2B 느낌이 좋음, 조금 더 보수적</text>
    <rect x="560" y="28" width="176" height="56" rx="12" fill="#111827"/><text x="560" y="111" class="hex">#111827</text>
    <rect x="800" y="28" width="176" height="56" rx="12" fill="#BCC4D0"/><text x="800" y="111" class="hex">#BCC4D0</text>
    <rect x="1040" y="28" width="176" height="56" rx="12" fill="#F7F8FA" stroke="#D8DDE4"/><text x="1040" y="111" class="hex">#F7F8FA</text>
    <rect x="1280" y="28" width="176" height="56" rx="12" fill="#6B7280"/><text x="1280" y="111" class="hex">#6B7280</text>
  </g>

  <g transform="translate(90 685)">
    <rect x="0" y="0" width="1420" height="126" rx="20" fill="#FFFFFF"/>
    <text x="0" y="70" class="rank">04</text>
    <text x="105" y="50" class="name">Carbon + Bronze Gray</text>
    <text x="105" y="82" class="desc">골드보다 덜 번쩍이고, 주황 제품색과도 자연스럽게 이어짐</text>
    <rect x="560" y="28" width="176" height="56" rx="12" fill="#1A1B1E"/><text x="560" y="111" class="hex">#1A1B1E</text>
    <rect x="800" y="28" width="176" height="56" rx="12" fill="#A77A55"/><text x="800" y="111" class="hex">#A77A55</text>
    <rect x="1040" y="28" width="176" height="56" rx="12" fill="#FBF8F2" stroke="#DDD7CB"/><text x="1040" y="111" class="hex">#FBF8F2</text>
    <rect x="1280" y="28" width="176" height="56" rx="12" fill="#85817A"/><text x="1280" y="111" class="hex">#85817A</text>
  </g>

  <g transform="translate(90 831)">
    <rect x="0" y="0" width="1420" height="126" rx="20" fill="#FFFFFF"/>
    <text x="0" y="70" class="rank">05</text>
    <text x="105" y="50" class="name">Slate Black + Mist Blue</text>
    <text x="105" y="82" class="desc">차분하고 깔끔한 인프라 느낌, 의료색은 약하게만 남음</text>
    <rect x="560" y="28" width="176" height="56" rx="12" fill="#18202A"/><text x="560" y="111" class="hex">#18202A</text>
    <rect x="800" y="28" width="176" height="56" rx="12" fill="#8FA6B8"/><text x="800" y="111" class="hex">#8FA6B8</text>
    <rect x="1040" y="28" width="176" height="56" rx="12" fill="#F7F9FA" stroke="#D8DDE4"/><text x="1040" y="111" class="hex">#F7F9FA</text>
    <rect x="1280" y="28" width="176" height="56" rx="12" fill="#7B8490"/><text x="1280" y="111" class="hex">#7B8490</text>
  </g>

  <g transform="translate(90 977)">
    <rect x="0" y="0" width="1420" height="126" rx="20" fill="#FFFFFF"/>
    <text x="0" y="70" class="rank">06</text>
    <text x="105" y="50" class="name">Forest Black + Sage</text>
    <text x="105" y="82" class="desc">보호/안정감은 좋지만 헬스케어 브랜드처럼 보일 수 있음</text>
    <rect x="560" y="28" width="176" height="56" rx="12" fill="#151C18"/><text x="560" y="111" class="hex">#151C18</text>
    <rect x="800" y="28" width="176" height="56" rx="12" fill="#9AA88F"/><text x="800" y="111" class="hex">#9AA88F</text>
    <rect x="1040" y="28" width="176" height="56" rx="12" fill="#F8F7F0" stroke="#DDD7CB"/><text x="1040" y="111" class="hex">#F8F7F0</text>
    <rect x="1280" y="28" width="176" height="56" rx="12" fill="#72786F"/><text x="1280" y="111" class="hex">#72786F</text>
