<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2100" viewBox="0 0 1800 2100">
  <rect width="1800" height="2100" fill="#F8F6F0"/>
  <style>
    .title { font-family: "Nimbus Sans", Arial, sans-serif; font-size: 72px; font-weight: 700; fill: #15171C; }
    .subtitle { font-family: "Nimbus Sans", Arial, sans-serif; font-size: 26px; font-weight: 400; fill: #737984; }
    .small { font-family: "Nimbus Sans", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #737984; letter-spacing: 1px; }
    .rank { font-family: "Nimbus Sans", Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #15171C; }
    .label { font-family: "Nimbus Sans", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #15171C; }
    .desc { font-family: "Nimbus Sans", Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #737984; }
    .tag { font-family: "Nimbus Sans", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #15171C; }
    .note { font-family: "Nimbus Sans", Arial, sans-serif; font-size: 22px; font-weight: 400; fill: #737984; }
  </style>

  <text x="96" y="115" class="title">Paraegis Wordmark Directions</text>
  <text x="96" y="160" class="subtitle">Font-only logo explorations. Clean parent-company identity, no symbol.</text>

  <g transform="translate(96 205)">
    <text x="0" y="0" class="small">COLOR BASE</text>
    <rect x="0" y="24" width="96" height="48" rx="10" fill="#15171C"/>
    <text x="0" y="100" class="small">#15171C</text>
    <rect x="130" y="24" width="96" height="48" rx="10" fill="#C8C2B4"/>
    <text x="130" y="100" class="small">#C8C2B4</text>
    <rect x="260" y="24" width="96" height="48" rx="10" fill="#F8F6F0" stroke="#D8D1C4"/>
    <text x="260" y="100" class="small">#F8F6F0</text>
    <rect x="390" y="24" width="96" height="48" rx="10" fill="#737984"/>
    <text x="390" y="100" class="small">#737984</text>
  </g>

  <g transform="translate(96 360)">
    <rect width="1608" height="142" rx="24" fill="#FFFFFF" stroke="#C8C2B4" stroke-width="3"/>
    <rect x="1280" y="28" width="190" height="36" rx="18" fill="#C8C2B4"/>
    <text x="1310" y="52" class="tag">RECOMMENDED</text>
    <text x="36" y="58" class="rank">01</text>
    <text x="36" y="93" class="desc">Modern Grotesk / 가장 무난한 최종안</text>
    <text x="275" y="94" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-1" fill="#15171C">Paraegis</text>
    <line x1="276" y1="114" x2="602" y2="114" stroke="#C8C2B4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(96 526)">
    <rect width="1608" height="142" rx="24" fill="#FFFFFF"/>
    <text x="36" y="58" class="rank">02</text>
    <text x="36" y="93" class="desc">Quiet Enterprise / 더 차분하고 B2B 느낌</text>
    <text x="275" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="80" font-weight="400" letter-spacing="-2" fill="#15171C">Paraegis</text>
  </g>

  <g transform="translate(96 692)">
    <rect width="1608" height="142" rx="24" fill="#FFFFFF"/>
    <text x="36" y="58" class="rank">03</text>
    <text x="36" y="93" class="desc">Premium Narrow / 길고 세련된 인프라 브랜드 느낌</text>
    <text x="275" y="94" font-family="Nimbus Sans Narrow, Arial Narrow, sans-serif" font-size="88" font-weight="400" letter-spacing="2" fill="#15171C">Paraegis</text>
  </g>

  <g transform="translate(96 858)">
    <rect width="1608" height="142" rx="24" fill="#FFFFFF"/>
    <text x="36" y="58" class="rank">04</text>
    <text x="36" y="93" class="desc">Soft Technical / 너무 차갑지 않은 SaaS</text>
    <text x="275" y="94" font-family="Latin Modern Sans, Nimbus Sans, sans-serif" font-size="82" font-weight="700" letter-spacing="0" fill="#15171C">Paraegis</text>
    <circle cx="683" cy="34" r="7" fill="#C8C2B4"/>
  </g>

  <g transform="translate(96 1024)">
    <rect width="1608" height="142" rx="24" fill="#FFFFFF"/>
    <text x="36" y="58" class="rank">05</text>
    <text x="36" y="93" class="desc">Humanist Serif / 더 고급스럽지만 SaaS감은 약함</text>
    <text x="275" y="95" font-family="Bitstream Charter, Georgia, serif" font-size="82" font-weight="400" letter-spacing="-2" fill="#15171C">Paraegis</text>
  </g>

  <g transform="translate(96 1190)">
    <rect width="1608" height="142" rx="24" fill="#FFFFFF"/>
    <text x="36" y="58" class="rank">06</text>
    <text x="36" y="93" class="desc">Editorial Serif / 이름이 예뻐 보임, 다만 덜 테크함</text>
    <text x="275" y="96" font-family="Utopia, Georgia, serif" font-size="84" font-weight="400" letter-spacing="-1" fill="#15171C">Paraegis</text>
  </g>

  <g transform="translate(96 1356)">
    <rect width="1608" height="142" rx="24" fill="#FFFFFF"/>
    <text x="36" y="58" class="rank">07</text>
    <text x="36" y="93" class="desc">Strong Sans / 단단하지만 조금 무거움</text>
    <text x="275" y="94" font-family="URW Gothic, Nimbus Sans, Arial, sans-serif" font-size="80" font-weight="700" letter-spacing="1" fill="#15171C">Paraegis</text>
  </g>

  <g transform="translate(96 1522)">
    <rect width="1608" height="142" rx="24" fill="#FFFFFF"/>
    <text x="36" y="58" class="rank">08</text>
    <text x="36" y="93" class="desc">Light Precision / 깔끔하지만 임팩트는 약함</text>
    <text x="275" y="94" font-family="Latin Modern Sans, Nimbus Sans, sans-serif" font-size="82" font-weight="400" letter-spacing="4" fill="#15171C">Paraegis</text>
  </g>

  <g transform="translate(96 1688)">
    <rect width="1608" height="142" rx="24" fill="#FFFFFF"/>
    <text x="36" y="58" class="rank">09</text>
    <text x="36" y="93" class="desc">All Caps / 로고감은 강하지만 발음 각인은 약함</text>
    <text x="275" y="94" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="10" fill="#15171C">PARAEGIS</text>
  </g>

  <g transform="translate(96 1854)">
    <rect width="1608" height="142" rx="24" fill="#FFFFFF"/>
    <text x="36" y="58" class="rank">10</text>
    <text x="36" y="93" class="desc">Mono Tech / 운영 도구 느낌은 강하지만 회사 로고로는 딱딱함</text>
    <text x="275" y="92" font-family="DejaVu Sans Mono, Nimbus Mono PS, monospace" font-size="72" font-weight="400" letter-spacing="-3" fill="#15171C">Paraegis</text>
  </g>

  <text x="96" y="2058" class="note">My pick: 01. Keep Paraegis as a wordmark first, then later extract a custom P for app icons or favicon.</text>
</svg>
